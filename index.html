<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <title>Music Player</title>
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    </head>
    <body>
      <div class="wrapper">
         <div class="top-bar">
            <!--i class="material-icons">expand_more</i-->
            <p style="text-align:center;">Music Player</p>
            <!--i class="material-icons">more_horizantal</i-->
         </div>

         <div class="img-area">
            <img src="" alt="">
         </div>

         <div class="song-details">
            <p class="name">Arjunaru Villu</p>
            <p class="artist">Manika vinayagam</p>
         </div>
 
         <div class="progress-area">
            <div class="progress-bar"></div>
               <div class="timer">
                  <span class="current">0:00</span>
                  <span class="duration">4:26</span>
               </div>

               <audio id="main-audio" src=""></audio>

         </div>

         <div class="controls">
            <i id="repeat-plist" class="material-icons" title="Playlist looped">repeat</i>
            <i id="prev" class="material-icons">skip_previous</i>
            <div class="play-pause">
              <i class="material-icons">play-arrow</i>
            </div>
               <i id="next" class="material-icons">skip_next</i>
               <i id="more-music" class="material-icons">queue_music</i>
         </div>

         <div class="music-list">
            <div class="header" >
               <div class="row">
                  <i class="material-icons">queue_music</i>
                  <span>Music list</span>
               </div>
               <i id="close" class="material-icons">close</i>
            </div>
